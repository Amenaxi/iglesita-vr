<!doctype html><html lang="es"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Iglesia de Tulpo - Babylon VR</title><style>html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* ===== Pantalla de bienvenida ===== */
    .welcome {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      background: linear-gradient(to bottom, #5fd68d, #2d8659);
      color: white;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10;
    }

    .leaves {
      position: absolute;
      width: 100%;
      height: 100%;
      background: url("assets/hoja.svg") center/cover no-repeat;
      opacity: 0.6;
      z-index: 0;
    }

    .content {
      z-index: 1;
      text-align: center;
      padding: 20px;
    }

    .content h1 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .content p {
      font-size: 16px;
      margin-bottom: 25px;
    }

    .btn {
      background-color: #ffd700;
      color: black;
      font-weight: bold;
      padding: 15px 40px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      font-size: 18px;
      transition: 0.3s;
    }
    .btn:hover {
      background-color: #e6c200;
    }

    /* ===== Canvas VR oculto al inicio ===== */
    #renderCanvas {
      width: 100%;
      height: 100%;
      display: none;
    }</style></head><body><div class="welcome" id="welcome"><div class="leaves"></div><div class="content"><h1>Iglesia de Tulpo</h1><p>Explora este escenario en Realidad Virtual</p><button class="btn" onclick="entrarVR()">Entrar en VR</button></div></div><canvas id="renderCanvas"></canvas><script defer="defer" src="bundle.a99052be0d130e0d309b.js"></script>
      <script>
            let startTime;
            function entrarVR() {
    document.getElementById("welcome").style.display = "none";
    document.getElementById("renderCanvas").style.display = "block";
                      
            startTime = Date.now(); // Guarda el tiempo de inicio
            console.log("⏱️ Escena iniciada para usuario:", userId);
                      
    // 👇 Forzar Cardboard / VR si está disponible
    if (window.enterXR) {
      window.enterXR();
    }
  }
      // Cuando el usuario cierre la pestaña o navegue fuera
  window.addEventListener("beforeunload", () => {
    if (startTime) {
      const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
      console.log("⏱️ Tiempo total:", elapsedSeconds, "segundos");

      // 👉 Enviar a tu API
      navigator.sendBeacon(
        "https://tu-api.com/tiempo",
        JSON.stringify({
          userId: userId,
          escena: "Iglesia de Tulpo", // Cambia según el escenario
          tiempo: elapsedSeconds,
        })
      );
    }
  });</script>
          <script defer="defer" src="bundle.c5654e41ac87b99f61cd.js"></script>
<script>
  // Función para obtener parámetros de la URL
  function getQueryParam(param) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(param);
  }

  // Guardamos el userId recibido
  const userId = getQueryParam("userId") || "anon";
  console.log("👤 Usuario activo:", userId);
</script>
</body></html>
